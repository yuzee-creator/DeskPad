name: Release APK

# Setelah "Build APK" sukses, APK otomatis dipasang di halaman Releases
# sebagai satu link unduhan tetap: .../releases/latest/download/DeskPad.apk
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeskPad-APK
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: apk

      - name: Terbitkan release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cp apk/*.apk DeskPad.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest DeskPad.apk --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --latest \
            --title "DeskPad terbaru" \
            --notes "Build otomatis dari commit $SHA"
